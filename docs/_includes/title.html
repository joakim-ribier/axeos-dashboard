{% if site.logo %}
  <div class="site-logo" role="img" aria-label="{{ site.title }}"></div>
{% else %}
  <span class="brand-title">
    <img class="brand-icon" src="{{ '/favicon.svg' | relative_url }}" alt="" width="32" height="32">
    <span class="brand-axeos">AxeOS</span>
    <span class="brand-dot">&middot;</span>
    <span class="brand-app"><span class="brand-d">D</span><span class="brand-hash-symbol">#</span><span class="brand-hash">hash</span><span class="brand-board">board</span></span>
  </span>
{% endif %}
