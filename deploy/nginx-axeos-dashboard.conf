server {
    listen 80 default_server;
    server_name _;

    location /api/ {
        proxy_pass http://localhost:8080;
	proxy_set_header X-REAL-IP $remote_addr;
	proxy_set_header True-Client-IP "";
    }

    location / {
        root @DEPLOY_DIR@/dist/ui;
        try_files $uri /index.html;
    }
}
