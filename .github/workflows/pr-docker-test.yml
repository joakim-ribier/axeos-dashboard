name: PR Docker Test Build

# Builds + pushes the "services" and "dashboard" images from a PR's current
# commit, tagged by short SHA (never touches the "latest" tag) -- lets
# anyone pull and try out a PR's changes via Docker before it's merged.
# Doesn't run on every push to the PR (that'd be a build per commit) --
# only when the "test-integration" label is added, and again each time
# it's re-added after a new commit.
on:
  pull_request:
    types: [labeled]

jobs:
  build:
    if: github.event.label.name == 'test-integration'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: resolve tag
        id: resolve
        run: echo "tag=sha-$(echo ${{ github.event.pull_request.head.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: build + push services image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/services.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_SHA=${{ steps.resolve.outputs.tag }}
          tags: ghcr.io/${{ github.repository }}/services:${{ steps.resolve.outputs.tag }}

      - name: build + push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dashboard.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/dashboard:${{ steps.resolve.outputs.tag }}

      - name: comment the command to test it on the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.resolve.outputs.tag }}"
          cmd="curl -fsSL https://raw.githubusercontent.com/joakim-ribier/axeos-dashboard/main/docker-install.sh | IMAGE_TAG=$tag bash"
          echo "$cmd"
          {
            echo "### 🐳 Test this PR's Docker images (tag \`$tag\`)"
            echo ""
            echo '```bash'
            echo "$cmd"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "### 🐳 Test this PR's Docker images (tag \`$tag\`)"
            echo ""
            echo '```bash'
            echo "$cmd"
            echo '```'
          } | gh pr comment ${{ github.event.pull_request.number }} --body-file -
