name: Release

# Publishes versioned Docker images to GHCR when a real GitHub Release is
# published under a "vX.Y.Z" tag (e.g. via "Draft a new release" -- typing
# a new tag there is enough, GitHub creates it for you) -- separate from
# latest.yml's rolling "latest" tag/release, which keeps publishing on
# every push to main exactly as before and is never touched by this
# workflow.
#
# `published` (not `created`) so a draft saved-but-not-yet-published never
# triggers a real multi-arch build/push.
#
# The `startsWith(..., 'v')` job guard matters more than it looks: without
# it, latest.yml's own "latest" release -- republished on every push to
# main -- would ALSO fire this workflow's `release: published` event (tag
# names aren't filterable on this trigger type, unlike `push: tags:`) and
# push an image tagged ":latest", colliding with the real one. The same
# guard also protects against picking that existing "latest" tag by
# mistake from the release form's tag dropdown -- it just skips, no image
# pushed, nothing to clean up.
on:
  release:
    types: [published]

jobs:
  docker:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: resolve version + sha
        id: resolve
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: build + push services image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/services.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_SHA=${{ steps.resolve.outputs.sha }}
            VERSION=${{ steps.resolve.outputs.version }}
          tags: ghcr.io/${{ github.repository }}/axeos-services:${{ steps.resolve.outputs.version }}

      - name: build + push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dashboard.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/axeos-dashboard:${{ steps.resolve.outputs.version }}
