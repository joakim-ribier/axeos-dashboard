name: Release

# Publishes versioned Docker images to GHCR, and attaches the binaries + UI
# (build.yml, stamped with the version) to the release itself, when a real
# GitHub Release is published under a "vX.Y.Z" tag (e.g. via "Draft a new
# release" -- typing a new tag there is enough, GitHub creates it for
# you), so `make update` can install that version -- separate from
# latest.yml's rolling "latest" tag/release, which keeps publishing on
# every push to main exactly as before and is never touched by this
# workflow.
#
# `published` (not `created`) so a draft saved-but-not-yet-published never
# triggers a real multi-arch build/push.
#
# The `startsWith(..., 'v')` job guard matters more than it looks: without
# it, latest.yml's own "latest" release -- republished on every push to
# main -- would ALSO fire this workflow's `release: published` event (tag
# names aren't filterable on this trigger type, unlike `push: tags:`) and
# push an image tagged ":latest", colliding with the real one. The same
# guard also protects against picking that existing "latest" tag by
# mistake from the release form's tag dropdown -- it just skips, no image
# pushed, nothing to clean up.
on:
  release:
    types: [published]

jobs:
  version:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.release.tag_name }}
      version: ${{ needs.version.outputs.version }}

  assets:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: binaries-*
          merge-multiple: true

      - name: attach the binaries + UI to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG_NAME" dist/* --clobber --repo ${{ github.repository }}

  docker:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: resolve sha
        id: resolve
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: build + push services image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/services.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_SHA=${{ steps.resolve.outputs.sha }}
            VERSION=${{ needs.version.outputs.version }}
          tags: ghcr.io/${{ github.repository }}/axeos-services:${{ needs.version.outputs.version }}

      - name: build + push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dashboard.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/axeos-dashboard:${{ needs.version.outputs.version }}
