name: Latest Release

on:
  workflow_run:
    workflows: ["Checks"]
    types: [completed]
    branches: [main]
  # Manual escape hatch: GitHub's workflow_run trigger occasionally never
  # fires (or fires very late) due to a platform-side delay/glitch, even
  # when the triggering "Checks" run genuinely succeeded. Dispatching this
  # manually from the Actions tab (or `gh workflow run latest.yml`)
  # publishes "latest" from the current tip of whichever branch you pick
  # (main, by default) without waiting on that trigger.
  workflow_dispatch: {}

jobs:
  # Resolves which commit to publish and whether it's safe to proceed.
  # Automatic runs (triggered by Checks completing) require Checks to have
  # succeeded -- so the badge actually means "latest matches the last
  # commit on main", not just "nothing failed" (an all-skipped run would
  # otherwise report success). A manual run (workflow_dispatch) is an
  # explicit human override and always proceeds.
  guard:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: require Checks to have succeeded (automatic runs only)
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
        run: |
          echo "::error::Checks did not succeed (conclusion: ${{ github.event.workflow_run.conclusion }}) for ${{ github.event.workflow_run.head_sha }} — refusing to publish 'latest'."
          exit 1

      - name: resolve commit to publish
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: guard
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64, amd64] # arm64: Raspberry Pi. amd64: typical VPS (e.g. hashboard).
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.3"
          cache-dependency-path: server/go.sum

      - name: build binaries (linux/${{ matrix.arch }})
        working-directory: server
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p ../dist
          sha=$(echo "${{ needs.guard.outputs.sha }}" | cut -c1-7)
          ldflags="-X github.com/joakimribier/axeos-bitaxe-dashboard/server/internal/version.GitSHA=$sha"
          go build -ldflags "$ldflags" -o ../dist/feeder-${{ matrix.arch }} ./cmd/feeder
          go build -ldflags "$ldflags" -o ../dist/dashboard-api-${{ matrix.arch }} ./cmd/dashboard-api
          go build -ldflags "$ldflags" -o ../dist/remote-dashboard-api-${{ matrix.arch }} ./cmd/remote-dashboard-api

      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.arch }}
          path: dist/*
          retention-days: 1

  release:
    needs: [guard, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.sha }}

      # Delete any existing "latest" release + tag first. action-gh-release
      # replaces assets with matching names but never removes ones that are no
      # longer in `files:` below (e.g. after a rename) — they'd otherwise pile
      # up as stale orphans forever. Starting fresh each run avoids that.
      - name: delete stale "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --yes --cleanup-tag --repo ${{ github.repository }} || true

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: binaries-*
          merge-multiple: true

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: build UI
        working-directory: ui
        env:
          API_PORT: "8080" # placeholder — only proxy target for dev/preview, not baked into the build
        run: |
          npm ci
          npm run build
          tar -czf ../dist/ui-dist.tar.gz -C dist .

      - name: publish rolling "latest" release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: "latest (${{ needs.guard.outputs.sha }})"
          target_commitish: ${{ needs.guard.outputs.sha }}
          prerelease: true
          make_latest: "true"
          body: |
            Built from commit ${{ needs.guard.outputs.sha }} on `main`.
            Binaries for linux/arm64 (Raspberry Pi) and linux/amd64 (typical VPS).
            Fetch with `make latest-up` (Pi, dashboard-api + feeder) or
            `make latest-remote-up` (VPS, remote-dashboard-api) — both auto-detect
            the local architecture.
          files: |
            dist/feeder-arm64
            dist/feeder-amd64
            dist/dashboard-api-arm64
            dist/dashboard-api-amd64
            dist/remote-dashboard-api-arm64
            dist/remote-dashboard-api-amd64
            dist/ui-dist.tar.gz
