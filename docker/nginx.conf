server {
    listen 80 default_server;
    server_name _;

    # Everything under /api/ -> the app container (dashboard-api, :8080).
    # "app" is resolved at request time via Docker's embedded DNS (127.0.0.11),
    # not once at nginx startup -- a static `proxy_pass http://app:8080;`
    # makes nginx refuse to start at all ("host not found in upstream") if
    # app isn't already up and registered on the network at that exact
    # moment (e.g. still starting, briefly down during a restart). This way
    # nginx always starts; a request just gets a 502 until app is reachable.
    resolver 127.0.0.11 valid=10s;
    location /api/ {
        set $app_upstream app:8080;
        proxy_pass http://$app_upstream;
    }

    # Everything else -> the static UI, falling back to index.html for
    # client-side routes (single-page app).
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
