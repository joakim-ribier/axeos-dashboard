basePath: /
definitions:
  alerts.Event:
    properties:
      hostname:
        type: string
      ip:
        type: string
      mac:
        type: string
      message:
        type: string
      peak:
        type: number
      raisedAt:
        description: |-
          Cleared only: when it was raised, and the highest reading meanwhile
          (temp/fan).
        type: string
      state:
        $ref: '#/definitions/alerts.State'
      threshold:
        type: number
      ts:
        type: string
      type:
        type: string
      value:
        description: |-
          Raised only: the reading that raised it (temp/fan), or what it's about
          (the firmware available, the MAC reported, the connection error).
        type: number
    type: object
  alerts.State:
    enum:
    - raised
    - cleared
    type: string
    x-enum-varnames:
    - Raised
    - Cleared
  audit.Change:
    properties:
      after:
        type: string
      before:
        type: string
      field:
        type: string
      kind:
        $ref: '#/definitions/audit.ChangeKind'
    type: object
  audit.ChangeKind:
    enum:
    - changed
    - added
    - removed
    type: string
    x-enum-varnames:
    - ChangeChanged
    - ChangeAdded
    - ChangeRemoved
  audit.Entry:
    properties:
      changes:
        description: |-
          What changed, before and after -- for the security-relevant types
          (see changes.go).
        items:
          $ref: '#/definitions/audit.Change'
        type: array
      cron:
        type: string
      error:
        description: Why it failed, whatever its source.
        type: string
      ip:
        description: |-
          API only: there's no authentication, so the client's IP and
          User-Agent are the closest thing to "who" this tool can record.
        type: string
      query:
        description: |-
          The request's query string, unescaped -- what was asked for (the
          months downloaded, the exported range, the miner a pool switch
          targeted...).
        type: string
      requestId:
        type: string
      service:
        description: System only.
        type: string
      source:
        $ref: '#/definitions/audit.Source'
      status:
        type: integer
      target:
        description: |-
          Target is the IP of the miner acted on -- empty for a config save,
          or a pool switch applied to every miner.
        type: string
      ts:
        type: string
      type:
        type: string
      userAgent:
        type: string
    type: object
  audit.Source:
    enum:
    - api
    - system
    type: string
    x-enum-varnames:
    - SourceAPI
    - SourceSystem
  backup.Info:
    properties:
      checksum:
        description: Checksum is the archive's MD5, set once the month is final.
        type: string
      month:
        type: string
      size:
        type: integer
      updatedAt:
        type: string
    type: object
  config.AlertsConfig:
    properties:
      mail:
        description: |-
          Mail sends one mail per feeder poll that raised alerts -- never for
          one that ends.
        type: boolean
    type: object
  config.AppSettingsFile:
    properties:
      electricity:
        $ref: '#/definitions/config.ElectricityConfig'
      firmware:
        $ref: '#/definitions/config.AppSettingsFirmware'
      notifications:
        $ref: '#/definitions/config.NotificationsConfig'
      pools:
        $ref: '#/definitions/config.PoolsConfig'
      remote:
        $ref: '#/definitions/config.RemoteConfig'
    type: object
  config.AppSettingsFirmware:
    properties:
      repos:
        additionalProperties:
          type: string
        type: object
    type: object
  config.AuditReportConfig:
    properties:
      enabled:
        type: boolean
      frequency:
        $ref: '#/definitions/config.ReportFrequency'
      skipIfEmpty:
        description: SkipIfEmpty sends nothing for a period nothing was recorded in.
        type: boolean
      types:
        description: Types narrows it to these audit entry types -- all of them when
          empty.
        items:
          type: string
        type: array
    type: object
  config.Bitaxe:
    properties:
      alias:
        description: |-
          Alias is an optional operator-set override for the display name shown
          in the UI wherever Hostname would otherwise be shown (see
          DisplayName). Unlike Hostname -- which a network discovery re-probe
          (see internal/discovery, and the "select an already-configured
          device" refresh flow in the Settings UI) silently overwrites with
          whatever the device itself reports -- Alias is never touched by
          discovery, so it's the one place a custom, human-chosen name survives
          a refresh.
        type: string
      enabled:
        type: boolean
      fallbackPort:
        type: integer
      fallbackUrl:
        type: string
      fallbackUser:
        type: string
      hostname:
        type: string
      ip:
        type: string
      mac:
        description: |-
          Mac is the device's MAC address (colons/hyphens optional, normalized
          by StorageKey) -- the storage-directory key, stable across IP/
          location changes unlike Ip. Populated either by hand or by the network
          discovery flow (see internal/discovery), which reads it straight off
          the device's own /api/system/info response.
        type: string
      model:
        $ref: '#/definitions/config.Model'
      port:
        type: integer
      schedule:
        items:
          $ref: '#/definitions/config.CronSchedule'
        type: array
      url:
        type: string
      user:
        type: string
    type: object
  config.CronSchedule:
    properties:
      action:
        $ref: '#/definitions/config.ScheduleAction'
      cron:
        type: string
    type: object
  config.ElectricityConfig:
    properties:
      devices:
        description: |-
          Devices are the non-miner power consumers (fan, router...), declared by
          hand since nothing can poll them -- so the installation's figures
          they feed are only ever an informative estimate, kept apart from the
          miners' measured ones.
        items:
          $ref: '#/definitions/config.PowerDevice'
        type: array
      ratePerKwh:
        description: RatePerKwh is the electricity cost in euros per kilowatt-hour
          (e.g. 0.1915 for 19.15 cts/kWh).
        type: number
    type: object
  config.MailConfig:
    properties:
      smtp:
        $ref: '#/definitions/config.SMTPConfig'
      to:
        items:
          type: string
        type: array
    type: object
  config.Model:
    enum:
    - bitaxe
    - nerdaxe
    type: string
    x-enum-varnames:
    - ModelBitaxe
    - ModelNerdaxe
  config.NotificationsConfig:
    properties:
      alerts:
        $ref: '#/definitions/config.AlertsConfig'
      auditReport:
        $ref: '#/definitions/config.AuditReportConfig'
      dashboardURL:
        description: |-
          DashboardURL is the dashboard's own address as reached from where the
          messages are read (e.g. http://192.168.1.60) -- for their links.
        type: string
      language:
        description: 'Language is the messages'' language: "fr" or "en" (the default).'
        type: string
      mail:
        $ref: '#/definitions/config.MailConfig'
    type: object
  config.PoolsConfig:
    properties:
      dashboards:
        additionalProperties:
          type: string
        description: |-
          Dashboards maps a stratum pool hostname to its web dashboard URL
          template. Use {user} as placeholder — replaced by the account part
          of the stratum user (before the first dot). Example:
          "stratum.braiins.com" -> "https://pool.braiins.com/mining/overview/{user}"
        type: object
    type: object
  config.PowerDevice:
    properties:
      name:
        type: string
      power:
        description: Power is the device's constant draw, in watts.
        type: number
    type: object
  config.RemoteConfig:
    properties:
      apiKey:
        type: string
      pushURL:
        type: string
      sendIP:
        type: boolean
      sendPools:
        type: boolean
      sendUser:
        description: |-
          SendUser, SendPools and SendIP opt in to pushing the stratum users (a
          wallet address, often), the pools and the miners' IPs (a map of the
          local network) -- off by default, nothing sensitive leaves the Pi
          unless the operator asks for it. Without SendIP a board knows each
          miner by an IPv6 made from its MAC instead (see the feeder's
          maskedIP).
        type: boolean
    type: object
  config.ReportFrequency:
    enum:
    - daily
    - every2days
    - weekly
    - monthly
    type: string
    x-enum-comments:
      ReportDaily: 'every night: the day before'
      ReportEvery2Days: 'every other night: the 2 days before'
      ReportMonthly: 'the night of the 1st: the month before'
      ReportWeekly: 'Sunday to Monday night: Monday to Sunday'
    x-enum-descriptions:
    - 'every night: the day before'
    - 'every other night: the 2 days before'
    - 'Sunday to Monday night: Monday to Sunday'
    - 'the night of the 1st: the month before'
    x-enum-varnames:
    - ReportDaily
    - ReportEvery2Days
    - ReportWeekly
    - ReportMonthly
  config.SMTPConfig:
    properties:
      from:
        type: string
      host:
        type: string
      password:
        description: |-
          Password is write-only through the API: it's stored here, but GET
          /api/config/settings only ever says whether one is set (see
          handler.appSettingsResponse).
        type: string
      port:
        type: integer
      security:
        $ref: '#/definitions/config.SMTPSecurity'
      username:
        type: string
    type: object
  config.SMTPSecurity:
    enum:
    - starttls
    - tls
    - none
    type: string
    x-enum-varnames:
    - SMTPStartTLS
    - SMTPTLS
    - SMTPNone
  config.ScheduleAction:
    enum:
    - switch_primary
    - switch_fallback
    - restart
    type: string
    x-enum-varnames:
    - ActionSwitchPrimary
    - ActionSwitchFallback
    - ActionRestart
  handler.AlertHistoryResponse:
    properties:
      events:
        items:
          $ref: '#/definitions/alerts.Event'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  handler.AlertsResponse:
    properties:
      events:
        items:
          $ref: '#/definitions/alerts.Event'
        type: array
      seenAt:
        type: string
    type: object
  handler.AlertsSeen:
    properties:
      seenAt:
        type: string
    type: object
  handler.AuditExport:
    properties:
      entries:
        items:
          $ref: '#/definitions/audit.Entry'
        type: array
      exportedAt:
        type: string
      from:
        type: string
      ip:
        type: string
      to:
        type: string
      total:
        type: integer
      type:
        type: string
    type: object
  handler.AuditResponse:
    properties:
      entries:
        items:
          $ref: '#/definitions/audit.Entry'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  handler.AuditTypesResponse:
    properties:
      types:
        items:
          type: string
        type: array
    type: object
  handler.BackupsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/backup.Info'
        type: array
    type: object
  handler.ErrorResponse:
    properties:
      code:
        type: integer
      error:
        type: string
      message:
        type: string
    type: object
  handler.HistoryResponse:
    properties:
      bucketSeconds:
        type: integer
      from:
        type: string
      miners:
        items:
          $ref: '#/definitions/handler.MinerHistory'
        type: array
    type: object
  handler.MinerHistory:
    properties:
      hashRate:
        description: TH/s
        items:
          type: number
        type: array
      ip:
        type: string
    type: object
  handler.ServiceStatus:
    properties:
      interval:
        type: string
      lastRunAt:
        type: string
      startedAt:
        type: string
      state:
        type: string
      version:
        type: string
    type: object
  handler.ServicesStatus:
    properties:
      dashboardApi:
        $ref: '#/definitions/handler.ServiceStatus'
      feeder:
        $ref: '#/definitions/handler.ServiceStatus'
      firmwareCache:
        allOf:
        - $ref: '#/definitions/handler.ServiceStatus'
        description: |-
          FirmwareCache is the feeder's check for new firmware releases, once
          per its TTL.
      healthCheck:
        $ref: '#/definitions/handler.ServiceStatus'
      mailer:
        $ref: '#/definitions/handler.ServiceStatus'
    type: object
  handler.StatsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/model.MinerInfo'
        type: array
      total:
        type: integer
    type: object
  handler.StatusResponse:
    properties:
      checkedAt:
        type: string
      remotePushConfigured:
        description: |-
          RemotePushConfigured is whether settings.yml has a hashboard push URL
          and key -- the UI only asks for the board's info (GET
          /api/remote/board) when it has.
        type: boolean
      services:
        $ref: '#/definitions/handler.ServicesStatus'
    type: object
  handler.alertsMailStatus:
    properties:
      lastError:
        type: string
      lastSentAt:
        type: string
    type: object
  handler.appSettingsDefaults:
    properties:
      firmware:
        $ref: '#/definitions/config.AppSettingsFirmware'
      pools:
        $ref: '#/definitions/config.PoolsConfig'
    type: object
  handler.appSettingsReadOnly:
    properties:
      alertsMail:
        allOf:
        - $ref: '#/definitions/handler.alertsMailStatus'
        description: |-
          AlertsMail is the mailer's record of the alerts mails (see
          alertmail.State).
      auditReport:
        allOf:
        - $ref: '#/definitions/handler.auditReportStatus'
        description: |-
          AuditReport is the mailer's record of the audit report (see
          auditreport.State), read back from disk -- the mailer sends it.
      feederInterval:
        type: string
      firmwareCacheCheckedAt:
        description: |-
          FirmwareCacheCheckedAt is the most recent CheckedAt across every
          model in the firmware cache (RFC3339, UTC) -- omitted if the cache
          is empty (nothing checked yet, e.g. fresh install or no miner has
          triggered a check). Lets the UI show "was this actually run" rather
          than just the configured TTL.
        type: string
      firmwareCacheTTL:
        type: string
      healthCheckInterval:
        type: string
    type: object
  handler.appSettingsResponse:
    properties:
      defaults:
        $ref: '#/definitions/handler.appSettingsDefaults'
      electricity:
        $ref: '#/definitions/config.ElectricityConfig'
      firmware:
        $ref: '#/definitions/config.AppSettingsFirmware'
      lastUpdated:
        type: string
      notifications:
        allOf:
        - $ref: '#/definitions/handler.notificationsResponse'
        description: |-
          Notifications shadows the embedded AppSettingsFile.Notifications: same
          JSON key, but a shape with no SMTP password field at all -- it never
          leaves the server.
      pools:
        $ref: '#/definitions/config.PoolsConfig'
      readOnly:
        $ref: '#/definitions/handler.appSettingsReadOnly'
      remote:
        $ref: '#/definitions/config.RemoteConfig'
    type: object
  handler.auditReportSettingsResponse:
    properties:
      enabled:
        type: boolean
      frequency:
        $ref: '#/definitions/config.ReportFrequency'
      skipIfEmpty:
        description: SkipIfEmpty sends nothing for a period nothing was recorded in.
        type: boolean
      types:
        description: Types is never null, unlike the config's (empty = every type).
        items:
          type: string
        type: array
    type: object
  handler.auditReportStatus:
    properties:
      lastAttemptAt:
        type: string
      lastError:
        type: string
      lastFrom:
        description: |-
          LastFrom/LastTo is the period last mailed ("2006-01-02", To
          excluded).
        type: string
      lastSentAt:
        type: string
      lastTo:
        type: string
    type: object
  handler.bitaxesResponse:
    properties:
      bitaxes:
        items:
          $ref: '#/definitions/config.Bitaxe'
        type: array
      lastUpdated:
        type: string
    type: object
  handler.mailSettingsResponse:
    properties:
      smtp:
        $ref: '#/definitions/handler.smtpSettingsResponse'
      to:
        items:
          type: string
        type: array
    type: object
  handler.notificationsResponse:
    properties:
      alerts:
        $ref: '#/definitions/config.AlertsConfig'
      auditReport:
        $ref: '#/definitions/handler.auditReportSettingsResponse'
      dashboardURL:
        type: string
      language:
        type: string
      mail:
        $ref: '#/definitions/handler.mailSettingsResponse'
    type: object
  handler.smtpSettingsResponse:
    properties:
      from:
        type: string
      host:
        type: string
      passwordSet:
        description: PasswordSet is all that's ever said about the password.
        type: boolean
      port:
        type: integer
      security:
        $ref: '#/definitions/config.SMTPSecurity'
      username:
        type: string
    type: object
  main.alertsMailRequest:
    properties:
      alerts:
        description: Alerts are the ones a feeder poll just raised.
        items:
          $ref: '#/definitions/alerts.Event'
        type: array
    type: object
  main.statusResponse:
    properties:
      lastCheckAt:
        description: |-
          LastCheckAt is the last time the mailer looked for a mail to send --
          once a minute, so an old one means its loop is stuck.
        type: string
      startedAt:
        type: string
    type: object
  main.testMailRequest:
    properties:
      kind:
        description: |-
          Kind "alert" or "audit" sends an example of the alerts mail or of the
          audit report instead, with made-up content.
        type: string
      lang:
        description: Lang picks the mail's language, the dashboard's own ("fr" or
          "en").
        type: string
    type: object
  main.testMailResponse:
    properties:
      sentTo:
        items:
          type: string
        type: array
    type: object
  model.InfoResponse:
    properties:
      appVersion:
        description: |-
          AppVersion is the semver this binary was published under (e.g.
          "0.1.0"), only set on a tagged-release build -- "dev" (the zero
          value's meaning) everywhere else, including the rolling "latest"
          build. The UI shows this instead of BuildSHA when it's a real
          version, and falls back to BuildSHA otherwise -- see
          internal/version.Version.
        type: string
      appVersionReleaseURL:
        type: string
      appVersionStatus:
        description: |-
          Whether this dashboard-api/remote-dashboard-api build itself is up to
          date with GitHub's "latest" release ("unknown" | "upToDate" |
          "updateAvailable") — see internal/appversion. Checked server-side at
          most once a day, so every client reads the same cached answer.
        type: string
      buildSHA:
        description: Git commit this binary was built from
        type: string
      hashboardURL:
        description: |-
          HashboardURL is the base URL of the hashboard instance backing this
          remote-dashboard-api (remote-dashboard-api only, config.HashboardURL)
          — lets the UI build a link to the board owner's hashboard account page.
        type: string
      remote:
        description: |-
          Remote is true for remote-dashboard-api, false for dashboard-api --
          the single React codebase can't otherwise tell which binary it's
          talking to (both serve the same routes, and hashboardURL alone isn't
          a reliable signal: remote-dashboard-api can leave it unconfigured
          too, see resources/remote-dashboard.yml). The UI needs this to know
          whether an unrecognized single path segment is even worth treating
          as a possible board id in the first place -- on dashboard-api, no
          board ever exists, so a mistyped URL must never surface board-only
          chrome (the public/private chip, the "board is private" screen).
        type: boolean
      ui:
        allOf:
        - $ref: '#/definitions/model.UIFeatures'
        description: |-
          UI mirrors config.UIConfig (each value normalized, so the frontend
          never sees an empty string) -- the single React codebase shows
          everything unless a flag here says otherwise, instead of hardcoding
          what "local" vs "remote" means.
    type: object
  model.MinerInfo:
    properties:
      alias:
        description: Operator-set override for Hostname (see config.Bitaxe.DisplayName)
          -- empty when not set, UI falls back to Hostname
        type: string
      alive:
        description: Health check
        type: boolean
      aliveCheckedAt:
        type: string
      bestDiff:
        description: Highest difficulty value ever solved by the miner since start‑up
        type: integer
      blockFound:
        type: integer
      deviceModel:
        description: Computed device model (e.g. "NerdQAxe++", "Bitaxe 602")
        type: string
      electricityRatePerKwh:
        description: Electricity cost
        type: number
      energyJPerTh:
        description: Energy consumption per terahash (Joules per TH)
        type: number
      error:
        description: |-
          Error surfaces a serious inconsistency the UI should call out
          distinctly from a normal offline/unreachable state -- currently just
          a mismatch between the configured mac: and what the device itself
          reports (wrong device at this IP, or a config typo).
        type: string
      fallbackStratumDashboardURL:
        description: Web dashboard URL for the fallback pool
        type: string
      fallbackStratumPort:
        type: integer
      fallbackStratumURL:
        type: string
      fallbackStratumUser:
        type: string
      fanspeed:
        description: Fan speed (linked to the Temp field)
        type: number
      hashRateTHs:
        description: Additional fields requested by the API
        type: number
      hostname:
        description: Human-readable name from config
        type: string
      ip:
        description: Miner IP address (derived from the folder name)
        type: string
      isUsingFallbackStratum:
        type: integer
      latestVersion:
        description: Latest firmware version available on GitHub
        type: string
      macAddr:
        description: Mac address
        type: string
      networkDifficulty:
        description: Current network difficulty reported by the pool (unitless)
        type: integer
      power:
        description: Watts (Joules per second)
        type: number
      releaseURL:
        description: GitHub releases page for the latest firmware version
        type: string
      responseTime:
        description: Ping/latency to the pool (ms).
        type: number
      sharesAccepted:
        type: integer
      sharesRejected:
        type: integer
      stratumDashboardURL:
        description: Web dashboard URL for the primary pool
        type: string
      stratumPort:
        description: Port of the primary Stratum pool
        type: integer
      stratumURL:
        description: |-
          Pool urls -- Stratum(Port|Fallback...) is what the device itself is
          currently connected with, straight off its own /api/system/info
          (see handler.PayloadStructure) -- not to be confused with the
          *configured* pool (config.Bitaxe.Url/Port/...), which the UI reads
          separately from GET /api/config/miners and compares against these to
          flag drift (see ui/src/utils/poolDrift.ts).
        type: string
      stratumUser:
        description: Username (typically miner ID) for the primary pool
        type: string
      temp:
        description: Primary temperature sensor reading (°C)
        type: number
      timestamp:
        type: string
      totalElectricityCost:
        description: |-
          TotalElectricityCost is this miner's cumulative cost (in the
          operator's own currency, see settings.yml's electricity.ratePerKwh)
          since it has been tracked -- each poll's slice uses the rate that was
          actually in effect at that poll (RawSample.ElectricityRate), not
          today's rate, so a later rate change never rewrites past cost. Not
          shown per-miner in the UI -- summed across the fleet for the
          "Électricité" KPI card's all-time figure instead.
        type: number
      totalSharesAccepted:
        type: integer
      totalSharesRejected:
        type: integer
      totalUptimeSeconds:
        description: |-
          Total* are persistent, reboot-surviving counters (see
          internal/storage.Totals) -- unlike SharesAccepted/SharesRejected and
          UptimeSeconds above, which reset whenever the device itself reboots,
          these keep accumulating for as long as the miner has been tracked.
          Zero until the feeder has written at least one totals.json for this
          miner, or until the backfill tool has run.
        type: integer
      updateAvailable:
        description: True when LatestVersion != Version
        type: boolean
      uptimeSeconds:
        description: Miner uptime in seconds
        type: integer
      version:
        description: Firmware version (e.g. "v2.12.2")
        type: string
      voltage:
        description: Volts (millivolts)
        type: number
    type: object
  model.MinersResponse:
    properties:
      boardPublic:
        description: |-
          BoardPublic reflects hashboard's Account.Public flag for this board
          (remote-dashboard-api only) — meaningless/always false for local
          dashboard-api, which has no such concept and whose UI never reads it.
        type: boolean
      configured:
        description: Number of miners in config
        type: integer
      devices:
        description: |-
          Echoed from settings so the dashboard needs no second request. Nothing
          about them is tracked over time: a constant declared draw can't give a
          real cumulative cost, only an informative estimate.
        items:
          $ref: '#/definitions/config.PowerDevice'
        type: array
      miners:
        items:
          $ref: '#/definitions/model.MinerInfo'
        type: array
      total:
        description: Number of miners successfully loaded
        type: integer
    type: object
  model.UIActionFeatures:
    properties:
      minerPoolSwitch:
        type: string
      minerRestart:
        description: |-
          MinerRestart/MinerPoolSwitch: "enabled" | "readonly" | "hidden" --
          see config.UIActionConfig. "readonly" renders the button disabled
          (with a hint), "hidden" doesn't render it at all.
        type: string
    type: object
  model.UIFeatures:
    properties:
      action:
        $ref: '#/definitions/model.UIActionFeatures'
      page:
        $ref: '#/definitions/model.UIPageFeatures'
    type: object
  model.UIPageFeatures:
    properties:
      audit:
        description: 'Audit: "enabled" | "hidden" -- see config.UIPageConfig.'
        type: string
      backups:
        description: 'Backups: "enabled" | "hidden" -- see config.UIPageConfig.'
        type: string
      settings:
        description: 'Settings: "enabled" | "readonly" | "hidden" -- see config.UIPageConfig.'
        type: string
    type: object
  remotepush.Board:
    properties:
      boardId:
        type: string
      dashboardURL:
        type: string
      hashboardURL:
        type: string
      lastSampleAt:
        type: string
      public:
        type: boolean
    type: object
host: localhost:8080
info:
  contact: {}
  description: |-
    Local, read/write REST API for AxeOs-compatible miners (Bitaxe, NerdAxe) on your LAN.
    No authentication — internal LAN use only.

    Endpoints are grouped by the service answering them: dashboard-api (this binary, default :8080);
    remote-dashboard-api (default :8081), a read-only API serving the miners pushed to hashboard.live;
    the mailer (default :8082, on the loopback only), reached through dashboard-api.
  title: axeos-dashboard API
  version: "1.0"
paths:
  /api/{boardId}/{ip}/stats:
    get:
      description: Same as /api/miners/{hostnameOrIp}/stats, for a miner pushed to
        a hashboard board.
      parameters:
      - description: hashboard board ID
        in: path
        name: boardId
        required: true
        type: string
      - description: Miner IP
        in: path
        name: ip
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.StatsResponse'
        "500":
          description: data file missing or unreadable
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get the last 24h of stats for one remote miner (read-only)
      tags:
      - Board miners
  /api/{boardId}/miners:
    get:
      description: Auto-discovers miners from the board's bitaxes directory — no local
        config needed, data comes from whatever the feeder already pushed to hashboard.live.
      parameters:
      - description: hashboard board ID
        in: path
        name: boardId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.MinersResponse'
        "404":
          description: board not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: List miners pushed to a hashboard board (read-only)
      tags:
      - Board miners
  /api/{boardId}/miners/history:
    get:
      description: Same as /api/miners/history, for the miners pushed to a hashboard
        board.
      parameters:
      - description: hashboard board ID
        in: path
        name: boardId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.HistoryResponse'
        "404":
          description: board not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get the last 24h of every remote miner, downsampled (read-only)
      tags:
      - Board miners
  /api/audit:
    get:
      description: Every user-triggered action that matters (miner restart, pool switch,
        config save, audit export, backups download, network scan) between from (inclusive)
        and to (exclusive) -- newest first. Both default to the last 24 hours; the
        range can't exceed a year. API entries carry the client's IP and User-Agent,
        system entries the service that acted (e.g. the scheduler).
      parameters:
      - description: 'range start, RFC 3339 (default: to minus 24h)'
        in: query
        name: from
        type: string
      - description: 'range end, RFC 3339 (default: now)'
        in: query
        name: to
        type: string
      - description: only this miner's entries (its IP) -- a pool switch applied to
          every miner included
        in: query
        name: ip
        type: string
      - description: only this type -- one of GET /api/audit/types
        in: query
        name: type
        type: string
      - description: page number, 1-based (default 1)
        in: query
        name: page
        type: integer
      - description: entries per page (default 50, max 200)
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AuditResponse'
        "400":
          description: from/to malformed, from not before to, or range over a year
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: the audit log couldn't be read
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: List audit entries
      tags:
      - Audit
  /api/audit/export:
    get:
      description: 'Same range and defaults as GET /api/audit (last 24 hours, at most
        a year), unpaginated, as a JSON file attachment: the resolved range, the export
        time and the entry count, then every entry.'
      parameters:
      - description: 'range start, RFC 3339 (default: to minus 24h)'
        in: query
        name: from
        type: string
      - description: 'range end, RFC 3339 (default: now)'
        in: query
        name: to
        type: string
      - description: only this miner's entries (its IP) -- a pool switch applied to
          every miner included
        in: query
        name: ip
        type: string
      - description: only this type -- one of GET /api/audit/types
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AuditExport'
        "400":
          description: from/to malformed, from not before to, or range over a year
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: the audit log couldn't be read
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Export audit entries
      tags:
      - Audit
  /api/audit/types:
    get:
      description: Every type an audit entry can have, in the order the dashboard
        offers them -- the values GET /api/audit and /api/audit/export accept as type.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AuditTypesResponse'
      summary: List audit entry types
      tags:
      - Audit
  /api/backups:
    get:
      description: Returns the monthly backup archives, most recent first. The feeder
        adds each completed (UTC) day to its month's archive, so the current month's
        archive is complete up to yesterday.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.BackupsResponse'
      summary: List monthly backups
      tags:
      - Backups
  /api/backups/download:
    get:
      description: 'Returns one zip holding the given months'' archives (up to yesterday
        for the current month): every miner''s daily JSONL files under data/bitaxes/
        -- unzip into storage.dataDir to restore.'
      parameters:
      - description: Comma-separated months, YYYY-MM
        in: query
        name: months
        required: true
        type: string
      produces:
      - application/zip
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: invalid or missing months
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: no backup for one of the months
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Download monthly backups
      tags:
      - Backups
  /api/config/discover:
    get:
      description: Probes a single IP (?ip=) or sweeps a CIDR range (?cidr=, max /24,
        defaults to the server's own local /24 subnet when both are omitted). ip takes
        priority if both are set.
      parameters:
      - description: Probe exactly this one IP instead of scanning a range (e.g. a
          device on a different VLAN than the server). Takes priority over cidr.
        in: query
        name: ip
        type: string
      - description: 'Network range to sweep, e.g. ''192.168.1.0/24'' (max /24 = 254
          hosts). Omitted: auto-detects and scans the server''s own local /24 subnet.
          Ignored if ip is set.'
        in: query
        name: cidr
        type: string
      - description: Per-host probe timeout, e.g. '500ms' or '2s' (default 1s, capped
          at 3s). Raise it and retry if a scan/probe found nothing on a slow network.
        in: query
        name: timeout
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.bitaxesResponse'
        "400":
          description: invalid/too-large cidr, or invalid/too-large timeout
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: no AxeOS device found at the given ip
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Discover AxeOS devices on the network
      tags:
      - Configuration
  /api/config/mail/test:
    post:
      consumes:
      - application/json
      description: Has the mailer service send a test mail to every configured recipient
        through the saved SMTP server.
      parameters:
      - description: 'Mail language (fr or en, default en), and kind (alert or audit:
          an example of that mail)'
        in: body
        name: request
        schema:
          properties:
            kind:
              type: string
            lang:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              sentTo:
                items:
                  type: string
                type: array
            type: object
        "400":
          description: SMTP server or recipients not configured
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "502":
          description: the SMTP server refused or couldn't be reached
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "503":
          description: the mailer service isn't running
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Send a test mail
      tags:
      - Notifications
  /api/config/miners:
    get:
      description: Returns every miner entry in the managed miners config, including
        disabled ones. Read-only -- see POST/DELETE for writing.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.bitaxesResponse'
      summary: List configured miners
      tags:
      - Configuration
    post:
      consumes:
      - application/json
      description: Upserts one or more miner entries into the managed miners file,
        matched by MAC. New entries are always saved enabled.
      parameters:
      - description: Miner entries to add/update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.bitaxesResponse'
      produces:
      - application/json
      responses:
        "200":
          description: the full, updated list of configured miners
          schema:
            $ref: '#/definitions/handler.bitaxesResponse'
        "400":
          description: invalid request body or entry
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: server not started with -miners -- nowhere safe to write
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: failed to write the miners file
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Add or update configured miners
      tags:
      - Configuration
  /api/config/settings:
    get:
      description: Returns the settings.yml overrides, the built-in defaults for pool
        dashboards/firmware repos, and a read-only snapshot of process-launch settings
        (poll intervals, firmware cache TTL) shown for visibility only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.appSettingsResponse'
      summary: Get app settings
      tags:
      - Configuration
    post:
      consumes:
      - application/json
      description: Validates and persists the editable subset of app settings to settings.yml.
      parameters:
      - description: Settings to save
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/config.AppSettingsFile'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.appSettingsResponse'
        "400":
          description: invalid settings
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: server has no resolvable config path -- nowhere safe to write
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: failed to write the app-settings file
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Save app settings
      tags:
      - Configuration
  /api/info:
    get:
      description: Returns this binary's git SHA, whether it's up to date with the
        latest GitHub release, the UI feature flags (see config.UIConfig), whether
        this is remote-dashboard-api (as opposed to dashboard-api), and (remote-dashboard-api
        only) the hashboard base URL.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.InfoResponse'
      summary: Server build/version info
      tags:
      - Info
  /api/mailer/alerts:
    post:
      consumes:
      - application/json
      description: 'The mailer''s own API, on the loopback only (mailer.port, default
        8082): mails the alerts a feeder poll just raised, all in one mail. Called
        by the feeder after a poll, when Configuration › Notifications turns the alerts
        mail on.'
      parameters:
      - description: The alerts raised
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.alertsMailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.testMailResponse'
        "400":
          description: no alert, or SMTP server or recipients not configured
          schema:
            properties:
              code:
                type: integer
              error:
                type: string
              message:
                type: string
            type: object
        "502":
          description: the SMTP server refused or couldn't be reached
          schema:
            properties:
              code:
                type: integer
              error:
                type: string
              message:
                type: string
            type: object
      summary: Send an alerts mail (mailer)
      tags:
      - Mailer
  /api/mailer/status:
    get:
      description: 'The mailer''s own API, on the loopback only (mailer.port, default
        8082): since when it runs, and when its loop last looked for a mail to send
        (once a minute). Read through dashboard-api''s GET /api/status.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.statusResponse'
      summary: Mailer status
      tags:
      - Mailer
  /api/mailer/test:
    post:
      consumes:
      - application/json
      description: 'The mailer''s own API, on the loopback only (mailer.port, default
        8082): sends a test mail to every recipient through the saved SMTP server
        -- or, with kind "alert" or "audit", an example of the alerts mail or of the
        audit report with made-up content. Reached through dashboard-api''s POST /api/config/mail/test.'
      parameters:
      - description: Mail language (fr or en, default en), and kind (alert or audit
          for an example of that mail)
        in: body
        name: request
        schema:
          $ref: '#/definitions/main.testMailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.testMailResponse'
        "400":
          description: SMTP server or recipients not configured
          schema:
            properties:
              code:
                type: integer
              error:
                type: string
              message:
                type: string
            type: object
        "502":
          description: the SMTP server refused or couldn't be reached
          schema:
            properties:
              code:
                type: integer
              error:
                type: string
              message:
                type: string
            type: object
      summary: Send a test mail (mailer)
      tags:
      - Mailer
  /api/miners:
    get:
      description: Returns every enabled miner with its latest snapshot (hashrate,
        temp, shares, pool, uptime...).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.MinersResponse'
      summary: List all configured miners
      tags:
      - Miners
  /api/miners/{hostnameOrIp}/restart:
    post:
      description: Restarts the device via its AxeOs restart endpoint.
      parameters:
      - description: Miner IP or configured hostname
        in: path
        name: hostnameOrIp
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: miner not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "502":
          description: the miner is unreachable or rejected the restart request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Restart a miner
      tags:
      - Miner actions
  /api/miners/{hostnameOrIp}/stats:
    get:
      description: Returns every JSONL entry (one per poll cycle) of the last 24 hours
        for a single miner, oldest first, used by the miner panel's history chart.
        An empty array when nothing was recorded in that time.
      parameters:
      - description: Miner IP or configured hostname
        in: path
        name: hostnameOrIp
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.StatsResponse'
        "404":
          description: miner not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get the last 24h of stats for one miner
      tags:
      - Miners
  /api/miners/alerts:
    get:
      description: An alert is raised once when it starts and cleared once when it
        ends -- each is one event. Returns the most recent ones (last 30 days), across
        every miner, most recent first, and up to when they've been read.
      parameters:
      - description: max events to return (default 50, max 200)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AlertsResponse'
      summary: List the most recent alert changes
      tags:
      - Alerts
  /api/miners/alerts/active:
    get:
      description: Every alert raised and not cleared yet on an enabled miner, however
        long ago it was raised -- the event that raised it, most recent first.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/alerts.Event'
            type: array
      summary: List the alerts in progress
      tags:
      - Alerts
  /api/miners/alerts/history:
    get:
      description: Every alert raised or cleared on the given UTC day, across every
        miner, most recent first, optionally filtered by ip/type.
      parameters:
      - description: the UTC day (YYYY-MM-DD)
        in: query
        name: date
        required: true
        type: string
      - description: page number, 1-based (default 1)
        in: query
        name: page
        type: integer
      - description: events per page (default 50, max 200)
        in: query
        name: pageSize
        type: integer
      - description: filter to this miner IP only
        in: query
        name: ip
        type: string
      - description: filter to this alert type only
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AlertHistoryResponse'
      summary: List a single day's alert changes, paginated
      tags:
      - Alerts
  /api/miners/alerts/seen:
    post:
      consumes:
      - application/json
      description: Marks every alert up to seenAt as read, for every browser -- never
        moves it back. Returns the resulting seenAt.
      parameters:
      - description: up to when
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.AlertsSeen'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AlertsSeen'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Mark the alerts read
      tags:
      - Alerts
  /api/miners/history:
    get:
      description: Hashrate of every configured miner over the last 24 hours, averaged
        into 15-minute buckets (96 points, oldest first). Feeds the dashboard's fleet
        chart and per-miner sparklines.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.HistoryResponse'
      summary: Get the last 24h of every miner, downsampled
      tags:
      - Miners
  /api/miners/pool/fallback/enable:
    put:
      description: Switches miner(s) to the primary or fallback pool and restarts
        them to apply it.
      parameters:
      - description: Miner IP or hostname — omit to apply to all configured miners
        in: query
        name: miner
        type: string
      responses:
        "204":
          description: No Content
        "502":
          description: one or more miners didn't apply the change (unreachable, or
            rejected the request)
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Switch stratum pool
      tags:
      - Miner actions
  /api/miners/pool/primary/enable:
    put:
      description: Switches miner(s) to the primary or fallback pool and restarts
        them to apply it.
      parameters:
      - description: Miner IP or hostname — omit to apply to all configured miners
        in: query
        name: miner
        type: string
      responses:
        "204":
          description: No Content
        "502":
          description: one or more miners didn't apply the change (unreachable, or
            rejected the request)
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Switch stratum pool
      tags:
      - Miner actions
  /api/remote/board:
    get:
      description: 'Returns what hashboard knows about the board this instance pushes
        to: the link to its remote dashboard, and when hashboard last received a sample
        for it. Empty when remote push isn''t configured, or hashboard can''t be reached.
        Cached for one feeder interval.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/remotepush.Board'
      summary: Remote board info
      tags:
      - Remote push
  /api/status:
    get:
      description: 'How each process is doing -- dashboard-api, the feeder (its last
        poll), the health check, the mailer, the firmware cache: ok, late (nothing
        within twice its interval), offline (didn''t answer) or unknown (no run yet).
        Also whether remote (hashboard) push is configured.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.StatusResponse'
      summary: Services status
      tags:
      - Status
swagger: "2.0"
tags:
- description: Build and version, UI feature flags -- served by dashboard-api and
    remote-dashboard-api alike.
  name: Info
- description: The configured miners' latest snapshot, history and stats.
  name: Miners
- description: Restart a miner, switch its pool -- proxied to the device.
  name: Miner actions
- description: 'The alerts'' changes of state: raised once when one starts, cleared
    once when it ends.'
  name: Alerts
- description: Every user-triggered action and scheduled run, its types and export.
  name: Audit
- description: The monthly archives of the miners' history.
  name: Backups
- description: miners.yml and settings.yml, read and saved; network discovery.
  name: Configuration
- description: 'Mail: the test mail, sent by the mailer.'
  name: Notifications
- description: How every process of the dashboard is doing.
  name: Status
- description: The hashboard board this dashboard pushes to.
  name: Remote push
- description: A board's miners, their history and stats.
  name: Board miners
- description: The mailer's own API, on the loopback only.
  name: Mailer
x-tagGroups:
- name: dashboard-api
  tags:
  - Info
  - Miners
  - Miner actions
  - Alerts
  - Audit
  - Backups
  - Configuration
  - Notifications
  - Status
  - Remote push
- name: remote-dashboard-api
  tags:
  - Board miners
- name: mailer
  tags:
  - Mailer
