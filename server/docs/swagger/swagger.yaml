basePath: /
definitions:
  handler.AlertEntry:
    properties:
      alerts:
        items:
          $ref: '#/definitions/model.Alert'
        type: array
      hostname:
        type: string
      minerIp:
        type: string
      minerMac:
        type: string
      timestamp:
        type: string
    type: object
  handler.AlertEpisode:
    properties:
      firstSeen:
        type: string
      hostname:
        type: string
      lastSeen:
        type: string
      message:
        type: string
      minerIp:
        type: string
      minerMac:
        type: string
      occurrences:
        type: integer
      peakValue:
        type: number
      threshold:
        type: number
      type:
        type: string
    type: object
  handler.AlertHistoryResponse:
    properties:
      episodes:
        items:
          $ref: '#/definitions/handler.AlertEpisode'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  handler.ErrorResponse:
    properties:
      code:
        type: integer
      error:
        type: string
      message:
        type: string
    type: object
  handler.StatsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/model.MinerInfo'
        type: array
      total:
        type: integer
    type: object
  model.Alert:
    properties:
      message:
        type: string
      threshold:
        description: the threshold in effect at calculation time, omitted otherwise
        type: number
      type:
        description: '"tempHigh", "fanHigh", "offline", "macMismatch", "firmwareUpdate"'
        type: string
      value:
        description: the reading that triggered it (temp/fan), omitted otherwise
        type: number
    type: object
  model.InfoResponse:
    properties:
      appVersionReleaseURL:
        type: string
      appVersionStatus:
        description: |-
          Whether this dashboard-api/remote-dashboard-api build itself is up to
          date with GitHub's "latest" release ("unknown" | "upToDate" |
          "updateAvailable") — see internal/appversion. Checked server-side at
          most once a day, so every client reads the same cached answer.
        type: string
      buildSHA:
        description: Git commit this binary was built from
        type: string
      hashboardURL:
        description: |-
          HashboardURL is the base URL of the hashboard instance backing this
          remote-dashboard-api (remote-dashboard-api only, config.HashboardURL)
          — lets the UI build a link to the board owner's hashboard account page.
        type: string
    type: object
  model.MinerInfo:
    properties:
      alerts:
        description: |-
          Alerts is whatever the feeder computed and persisted at the poll that
          produced this snapshot (temp/fan out of range, offline, mac mismatch,
          firmware update) -- the current state as of Timestamp, not a live value.
        items:
          $ref: '#/definitions/model.Alert'
        type: array
      alive:
        description: Health check
        type: boolean
      aliveCheckedAt:
        type: string
      bestDiff:
        description: Highest difficulty value ever solved by the miner since start‑up
        type: integer
      blockFound:
        type: integer
      deviceModel:
        description: Computed device model (e.g. "NerdQAxe++", "Bitaxe 602")
        type: string
      electricityRatePerKwh:
        description: Electricity cost
        type: number
      energyJPerTh:
        description: Energy consumption per terahash (Joules per TH)
        type: number
      error:
        description: |-
          Error surfaces a serious inconsistency the UI should call out
          distinctly from a normal offline/unreachable state -- currently just
          a mismatch between the configured mac: and what the device itself
          reports (wrong device at this IP, or a config typo).
        type: string
      fallbackStratumDashboardURL:
        description: Web dashboard URL for the fallback pool
        type: string
      fallbackStratumURL:
        type: string
      fallbackStratumUser:
        type: string
      fanspeed:
        description: Fan speed (linked to the Temp field)
        type: number
      hashRateTHs:
        description: Additional fields requested by the API
        type: number
      hostname:
        description: Human-readable name from config
        type: string
      ip:
        description: Miner IP address (derived from the folder name)
        type: string
      isUsingFallbackStratum:
        type: integer
      latestVersion:
        description: Latest firmware version available on GitHub
        type: string
      macAddr:
        description: Mac address
        type: string
      networkDifficulty:
        description: Current network difficulty reported by the pool (unitless)
        type: integer
      power:
        description: Watts (Joules per second)
        type: number
      releaseURL:
        description: GitHub releases page for the latest firmware version
        type: string
      responseTime:
        description: Ping/latency to the pool (ms).
        type: number
      sharesAccepted:
        type: integer
      sharesRejected:
        type: integer
      stratumDashboardURL:
        description: Web dashboard URL for the primary pool
        type: string
      stratumURL:
        description: Pool urls
        type: string
      stratumUser:
        description: Username (typically miner ID) for the primary pool
        type: string
      temp:
        description: Primary temperature sensor reading (°C)
        type: number
      timestamp:
        type: string
      updateAvailable:
        description: True when LatestVersion != Version
        type: boolean
      uptimeSeconds:
        description: Miner uptime in seconds
        type: integer
      version:
        description: Firmware version (e.g. "v2.12.2")
        type: string
      voltage:
        description: Volts (millivolts)
        type: number
    type: object
  model.MinersResponse:
    properties:
      boardPublic:
        description: |-
          BoardPublic reflects hashboard's Account.Public flag for this board
          (remote-dashboard-api only) — meaningless/always false for local
          dashboard-api, which has no such concept and whose UI never reads it.
        type: boolean
      configured:
        description: Number of miners in config
        type: integer
      miners:
        items:
          $ref: '#/definitions/model.MinerInfo'
        type: array
      total:
        description: Number of miners successfully loaded
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: |-
    Local, read/write REST API for AxeOs-compatible miners (Bitaxe, NerdAxe) on your LAN.
    No authentication — internal LAN use only.

    Endpoints tagged "dashboard-api" run on this binary (default :8080).
    Endpoints tagged "remote-dashboard-api" run on the separate remote-dashboard-api binary (default :8081),
    a read-only API serving miners pushed to hashboard.live — see the project README.
  title: axeos-dashboard API
  version: "1.0"
paths:
  /api/{boardId}/{ip}/stats:
    get:
      description: Returns today's JSONL entries pushed to hashboard.live for a single
        miner in the board.
      parameters:
      - description: hashboard board ID
        in: path
        name: boardId
        required: true
        type: string
      - description: Miner IP
        in: path
        name: ip
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.StatsResponse'
        "500":
          description: data file missing or unreadable
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get today's stats for one remote miner (read-only)
      tags:
      - remote-dashboard-api
  /api/{boardId}/miners:
    get:
      description: Auto-discovers miners from the board's bitaxes directory — no local
        config needed, data comes from whatever the feeder already pushed to hashboard.live.
      parameters:
      - description: hashboard board ID
        in: path
        name: boardId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.MinersResponse'
        "404":
          description: board not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: List miners pushed to a hashboard board (read-only)
      tags:
      - remote-dashboard-api
  /api/{boardId}/miners/alerts:
    get:
      parameters:
      - description: hashboard board ID
        in: path
        name: boardId
        required: true
        type: string
      - description: max entries to return per miner (default 10)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.AlertEntry'
            type: array
      summary: List the most recent miner alerts for a hashboard board (read-only)
      tags:
      - remote-dashboard-api
  /api/{boardId}/miners/alerts/history:
    get:
      parameters:
      - description: hashboard board ID
        in: path
        name: boardId
        required: true
        type: string
      - description: the single day to scan (YYYY-MM-DD)
        in: query
        name: date
        required: true
        type: string
      - description: page number, 1-based (default 1)
        in: query
        name: page
        type: integer
      - description: episodes per page (default 50, max 200)
        in: query
        name: pageSize
        type: integer
      - description: filter to this miner IP only
        in: query
        name: ip
        type: string
      - description: filter to this alert type only
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AlertHistoryResponse'
      summary: List a single day's recorded miner alerts for a hashboard board, grouped
        into episodes and paginated (read-only)
      tags:
      - remote-dashboard-api
  /api/info:
    get:
      description: Returns this binary's git SHA, whether it's up to date with the
        latest GitHub release, and (remote-dashboard-api only) the hashboard base
        URL.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.InfoResponse'
      summary: Server build/version info
      tags:
      - dashboard-api
      - remote-dashboard-api
  /api/miners:
    get:
      description: Returns every enabled miner with its latest snapshot (hashrate,
        temp, shares, pool, uptime...).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.MinersResponse'
      summary: List all configured miners
      tags:
      - dashboard-api
  /api/miners/{hostnameOrIp}/restart:
    post:
      description: Restarts the device via its AxeOs restart endpoint.
      parameters:
      - description: Miner IP or configured hostname
        in: path
        name: hostnameOrIp
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: miner not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Restart a miner
      tags:
      - dashboard-api
  /api/miners/{hostnameOrIp}/stats:
    get:
      description: Returns today's JSONL entries (one per poll cycle) for a single
        miner, used by the "Today's History" chart.
      parameters:
      - description: Miner IP or configured hostname
        in: path
        name: hostnameOrIp
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.StatsResponse'
        "404":
          description: miner not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get today's stats for one miner
      tags:
      - dashboard-api
  /api/miners/alerts:
    get:
      description: Returns each miner's N most recent alert-bearing entries (today's
        history only).
      parameters:
      - description: max entries to return per miner (default 10)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.AlertEntry'
            type: array
      summary: List the most recent miner alerts
      tags:
      - dashboard-api
  /api/miners/alerts/history:
    get:
      description: Returns every alert episode (consecutive same-type occurrences
        collapsed into one) on the given day across all miners, most recently active
        first, optionally filtered by ip/type.
      parameters:
      - description: the single day to scan (YYYY-MM-DD)
        in: query
        name: date
        required: true
        type: string
      - description: page number, 1-based (default 1)
        in: query
        name: page
        type: integer
      - description: episodes per page (default 50, max 200)
        in: query
        name: pageSize
        type: integer
      - description: filter to this miner IP only
        in: query
        name: ip
        type: string
      - description: filter to this alert type only
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AlertHistoryResponse'
      summary: List a single day's recorded miner alerts, grouped into episodes and
        paginated
      tags:
      - dashboard-api
  /api/miners/pool/fallback/enable:
    put:
      description: Switches miner(s) to the primary or fallback pool and restarts
        them to apply it.
      parameters:
      - description: Miner IP or hostname — omit to apply to all configured miners
        in: query
        name: miner
        type: string
      responses:
        "204":
          description: No Content
      summary: Switch stratum pool
      tags:
      - dashboard-api
  /api/miners/pool/primary/enable:
    put:
      description: Switches miner(s) to the primary or fallback pool and restarts
        them to apply it.
      parameters:
      - description: Miner IP or hostname — omit to apply to all configured miners
        in: query
        name: miner
        type: string
      responses:
        "204":
          description: No Content
      summary: Switch stratum pool
      tags:
      - dashboard-api
  /api/miners/set/wifi:
    put:
      description: Pushes the configured WiFi SSID/password to miner(s) and restarts
        them. Disabled unless wifi.on is set in config.
      parameters:
      - description: Miner IP or hostname — omit to apply to all configured miners
        in: query
        name: miner
        type: string
      responses:
        "204":
          description: No Content
        "405":
          description: WiFi updates disabled by config
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Update WiFi credentials
      tags:
      - dashboard-api
swagger: "2.0"
