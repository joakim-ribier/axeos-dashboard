global:
  env: dev
server:
  port: "8081"
storage:
  dataDir: resources                         # root dir: logs written here, and where {dataDir}/data/boards resolves --
                                              # must be hashboard's own data root (see hashboard's storage.BoardBitaxesDir);
                                              # for local dev against a sibling hashboard checkout, point this at
                                              # that checkout's own resources dir (e.g. ../hashboard/resources)
hashboardURL: ""                             # base URL of the hashboard instance backing this board -- not configured by default, set your own (e.g. https://your-hashboard-domain.example in prod, http://localhost:5173 for local dev, as make remote-run does)
# Pool dashboard links and per-model firmware repo URLs (used to build the
# "view release" link on the update badge) come from the same built-in
# defaults as dashboard.yml -- see server/internal/config/defaults.go.
# No cacheTTL setting needed here: this binary never checks GitHub itself,
# it just reads latestFirmware from the pushed sample.
# A board is its home page alone -- no other page to show or hide. Its buttons
# are the dashboard's call (Configuration › Remote), on a private board only.
