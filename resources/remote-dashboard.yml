global:
  env: dev
server:
  port: "8081"
storage:
  dataDir: resources                         # root dir: logs written here
  boardsDir: ""                              # explicit path to hashboard boards dir (defaults to {dataDir}/data/boards when empty)
pools:
  dashboards:
    stratum.braiins.com: "https://pool.braiins.com/mining/overview/{user}"
    solo.atlaspool.io: "https://atlaspool.io/dashboard.html?wallet={user}"
firmware:
  # Same model->repo mapping as dashboard.yml — only used here to build the
  # "view release" link on the update badge (no cacheTTL needed: this binary
  # never checks GitHub itself, it just reads latestFirmware from the pushed sample).
  repos:
    bitaxe: "https://api.github.com/repos/bitaxeorg/esp-miner/releases/latest"
    nerdaxe: "https://api.github.com/repos/shufps/ESP-Miner-NerdQAxePlus/releases/latest"
