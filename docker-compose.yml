services:
  app:
    container_name: axeos-services
    build:
      context: .
      dockerfile: docker/services.Dockerfile
    image: ghcr.io/joakim-ribier/axeos-dashboard/services:latest
    volumes:
      - ./config:/config
      - ./data:/data
    restart: unless-stopped

  nginx:
    container_name: axeos-dashboard
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    image: ghcr.io/joakim-ribier/axeos-dashboard/dashboard:latest
    ports:
      # Random free host port by default (0) -- so nobody hits a conflict
      # just running `docker compose up`. A real deployment wants a fixed,
      # memorable port instead: set HTTP_PORT=80 in a .env file next to
      # this one (see readme/DEPLOYMENT.md).
      - "${HTTP_PORT:-0}:80"
    depends_on:
      - app
    restart: unless-stopped
